<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Thompson</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="app-header" data-tauri-drag-region>
    <nav class="navbar">
      <div class="left-nav">
        <button id="btn-settings" onclick="showPage('settings')">
          <span class="icon icon-settings"></span>
        </button>
        <button id="btn-commands" onclick="showPage('commands')">
          <span class="icon icon-commands"></span>
        </button>
      </div>
      <span id="status"></span>
      <button id="btn-chat" onclick="showPage('chat')">
        <span class="icon icon-chat"></span>
      </button>
    </nav>
  </header>

  <!--! chat -->

  <div id="page-chat" class="page">  
    <div class="chat">
      <div id="log"></div>
    </div>

    <div class="msg-input">
      <input id="cmd" placeholder="Введи команду..." autofocus />
      <div class="input-controls">
        <div class="left-controls">
          <button id="btn-mute" onclick="toggleMute()">
            <span class="icon icon-mute"></span>
          </button>
          <button id="btn-vinput" onclick="toggleListening()">
            <span class="icon icon-vinput-off"></span>
          </button>
        </div>
        <div class="right-controls">
          <div class="aimode">
            <span id="aimode-label" class="aimode-label">Ollama</span>
            <button id="btn-aimode" class="switch" role="switch" aria-checked="false" onclick="toggleAiMode()">
              <span class="switch-knob"></span>
            </button>
          </div>
          <button id="btn-send" onclick="sendCommand()">
            <span class="icon icon-send"></span>
          </button>
        </div>
      </div>  
    </div>

  </div>

  <!--! settings -->

  <div id="page-settings" class="page">
    <div class="settings-container">

      <!-- * models -->
      <label>Модель: <input id="set-model" type="text" placeholder="llama3.2:1b" /></label>
      <p>Ви можете знайти багато моделей на <a id="ollama-href" href="#" onclick="openExternal('https://ollama.com/library?sort=popular'); return false;">https://ollama.com</a></p>
      
      <!-- * cloud api -->
      <label>Gemini API ключ: <input id="set-gemini-key" type="text" /></label>

      <!-- * whisper model -->
      <label>Модель розпізнавання: <input id="set-whisper-model" type="text" placeholder="models/ggml-base.bin" /></label>

      <!-- * themes -->
      <label>Акцент: <input id="set-accent" type="color" /></label>
      <label>Фон: <input id="set-bg" type="color" /></label>
      <label>Другорядний: <input id="set-muted" type="color" /></label>
 
      <button onclick="saveSettings()">Зберегти</button>
    </div>
  </div>

  <!--! custom cmds -->
  <div id="page-commands" class="page">
    <div class="commands-container">
      <h2>Кастомні команди</h2>

      <div class="command-form">
        <label>Назва: <input id="cmd-name" type="text" placeholder="Відкрити термінал" /></label>
        <label>Команда/шлях: <input id="cmd-path" type="text" placeholder="kitty" /></label>
 
        <div class="cmd-block">
          <label>Тригери:</label>
          <div class="trigger-input">
            <input id="cmd-trigger-input" type="text" placeholder="terminal" />
            <button type="button" onclick="addTrigger()">+</button>
          </div>
          <div id="trigger-chips" class="trigger-chips"></div>
        </div>

        <button onclick="saveCommand()">Додати</button>
      </div>

      <div id="commands-list"></div>
      
    </div>
  </div>

  <!--! models -->

  <div id="page-models" class="page">
    <!-- v0.2+ -->
  </div>

  <script src="main.js" defer></script>
</body>
</html>
